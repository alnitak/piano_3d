name: piano_3d
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_scene: ^0.23.0
  vector_math: ^2.1.4
  flutter_soloud: ^5.0.0
  soundfont_kit:
    path: ../libs/soundfont_kit
  hooks: ^2.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

dependency_overrides:
  code_assets: ^1.2.1

flutter:
  uses-material-design: true
  assets:
    - flutter_scene_generated/
    - assets/SFX_StarWars_weapons.SF2
    - assets/RatAttack.sf2
